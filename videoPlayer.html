<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flexible Video Player</title>
</head>
<body>
  <h2>Video Player</h2>
  <video id="videoPlayer" controls width="800">
    <!-- Джерела відео будуть додаватися динамічно -->
    Your browser does not support the video tag.
  </video>

  <script>
    // Функція для отримання параметра video з URL
    function getVideoUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('video');
    }

    // Функція для визначення типу відео за розширенням
    function getVideoType(url) {
      const ext = url.split('.').pop().toLowerCase();
      switch(ext) {
        case 'mp4': return 'video/mp4';
        case 'webm': return 'video/webm';
        case 'ogg':
        case 'ogv': return 'video/ogg';
        default: return '';
      }
    }

    const videoUrl = getVideoUrl();
    const videoPlayer = document.getElementById('videoPlayer');

    if (videoUrl) {
      const type = getVideoType(videoUrl);
      if (type) {
        // Очищаємо попередні джерела
        videoPlayer.innerHTML = '';
        // Створюємо новий тег source
        const source = document.createElement('source');
        source.src = videoUrl;
        source.type = type;
        videoPlayer.appendChild(source);
        videoPlayer.load();

        // Додатково можна обробити помилки відтворення
        videoPlayer.onerror = function() {
          alert('Помилка відтворення відео. Можливо, формат не підтримується або файл недоступний.');
        };
      } else {
        document.body.insertAdjacentHTML('beforeend', '<p>Непідтримуваний формат відео.</p>');
      }
    } else {
      document.body.insertAdjacentHTML('beforeend', '<p>Параметр video не вказаний у URL.</p>');
    }
  </script>
</body>
</html>
